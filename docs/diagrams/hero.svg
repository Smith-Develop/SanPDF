  <text x="785" y="290" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#bbbbbb" text-anchor="start">Números reales</text>
  </g>
  <path id="hp2" d="M 452 293 C 500 293, 510 270, 966 270" fill="none" stroke="#3c3c3c" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle r="4.5" fill="#0066b1" opacity="0">
