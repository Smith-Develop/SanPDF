<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SanPDF: extensión de Chrome que convierte, edita, firma y comprime PDF sin subir nada">
  <desc>Un PDF entra en PDF G y salen, uno tras otro, Word, Excel, OCR, imágenes, firma y compresión.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="480" fill="#000000"/>
  <rect width="1200" height="480" fill="url(#grid)"/>
  <g>
    <clipPath id="clip00"><rect x="0" y="0" width="1200" height="4"><animate attributeName="width" from="0" to="1200" dur="1.2s" fill="freeze"/></rect></clipPath>
    <g clip-path="url(#clip00)">
      <rect x="0" y="0" width="400.0" height="4" fill="#0066b1"/>
      <rect x="400.0" y="0" width="400.0" height="4" fill="#1c69d4"/>
      <rect x="800.0" y="0" width="400.0" height="4" fill="#e22718"/>
    </g>
  </g>
  <text x="48" y="64" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2.5" fill="#7e7e7e" text-anchor="start">EXTENSIÓN PARA CHROME · 100 % LOCAL</text>
  <text x="48" y="128" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="start">SANPDF</text>
  <text x="50" y="168" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" font-weight="300" fill="#ffffff" text-anchor="start">Convierte, edita, firma y comprime tus PDF</text>
  <text x="50" y="198" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" font-weight="300" fill="#ffffff" text-anchor="start">en tu navegador. Ningún archivo sale de tu ordenador.</text>
  <g>
    <path d="M 110 250 L 158.4 250 L 176.0 267.6 L 176.0 335.8 L 110 335.8 Z" fill="#1f1f1f" stroke="#ffffff" stroke-width="2"/>
    <path d="M 158.4 250 L 158.4 267.6 L 176.0 267.6" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="101.2" y="302.8" width="50.6" height="19.8" fill="#e22718"/>
    <text x="126.5" y="317.65000000000003" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="12.100000000000001" font-weight="800" fill="#fff" text-anchor="middle">PDF</text>
  </g>
  <rect x="250" y="250" width="200" height="86" fill="#141414" stroke="#3c3c3c"/>
  <text x="350" y="288" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">PDF G</text>
  <text x="350" y="314" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#bbbbbb" text-anchor="middle">28 herramientas</text>
  <path id="h0" d="M 185 293 L 248 293" stroke="#3c3c3c" stroke-width="2" stroke-dasharray="5 5"/>
  <circle r="4.5" fill="#ffffff" opacity="0">
    <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite"><mpath href="#h0"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <path id="hp0" d="M 452 293 C 500 293, 510 270, 556 270" fill="none" stroke="#3c3c3c" stroke-width="1.5" stroke-dasharray="4 6"/>
