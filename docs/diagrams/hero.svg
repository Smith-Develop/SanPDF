    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.6s" fill="freeze"/>
    <rect x="765" y="340" width="185" height="68" fill="#141414" stroke="#3c3c3c"/>
    <rect x="765" y="340" width="4" height="68" fill="#e22718"/>
  <text x="785" y="372" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="start">FIRMA</text>
  <text x="785" y="394" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#bbbbbb" text-anchor="start">Firma y rellena</text>
  </g>
  <path id="hp5" d="M 452 293 C 500 293, 510 374, 966 374" fill="none" stroke="#3c3c3c" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle r="4.5" fill="#ffffff" opacity="0">
