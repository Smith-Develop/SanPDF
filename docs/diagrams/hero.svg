  <line x1="48" y1="430" x2="1152" y2="430" stroke="#3c3c3c"/>
  <text x="48" y="458" font-family="Consolas, 'Courier New', monospace" font-size="12" letter-spacing="2.5" fill="#7e7e7e" text-anchor="start">CONVERTIR · ORGANIZAR · EDITAR Y FIRMAR · OPTIMIZAR Y PROTEGER · CREAR</text>
