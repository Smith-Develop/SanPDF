  <text x="990" y="372" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="start">−80 %</text>
  <text x="990" y="394" font-family="Inter, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#bbbbbb" text-anchor="start">Comprime</text>
