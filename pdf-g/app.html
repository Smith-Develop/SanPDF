<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PDF G</title>
  <link rel="icon" href="icons/32.png" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#" id="homeLink"><img src="icons/128.png" alt="" width="34" height="34" /><span><b>PDF G</b><small>por Smith-Develop</small></span></a>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Buscar herramienta… (unir, excel, comprimir…)" /></div>
    <span class="local"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Todo se procesa en tu ordenador</span>
    <button class="btn sm shortcut" id="shortcutBtn" type="button" title="Crear un acceso directo en el escritorio"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13"/><path d="M8 21h8M12 17v4M9 11l3-3 3 3M12 8v6"/></svg>Acceso directo</button>
  </header>
  <main id="home" class="home"></main>
  <main id="tool" class="tool" hidden>
    <div class="tool-head">
      <button class="back" id="back" title="Volver"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="ti" id="toolIcon"></div>
      <div><h1 id="toolTitle"></h1><p id="toolDesc"></p></div>
    </div>
    <div class="tool-body">
      <section class="work" id="work"></section>
      <aside class="side">
        <div id="opts"></div>
        <button class="btn primary big" id="run" disabled>Procesar</button>
        <div class="results" id="results"></div>
      </aside>
    </div>
  </main>
  <div class="busy" id="busy" hidden><div class="busy-card"><div class="spinner"></div><p id="busyText"></p><div class="bar"><span id="busyBar"></span></div></div></div>
  <div class="toast" id="toast" hidden></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
